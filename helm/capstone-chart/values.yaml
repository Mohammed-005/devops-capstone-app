replicaCount: 2

image:
  repository: 337405469571.dkr.ecr.ap-southeast-2.amazonaws.com/devops-capstone-app
  tag: "22dcf5af9a6e6cf42a8f4b8a726e6e6bc8f9786c"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: aws-ecr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

alertmanager:
  config:
    global:
      slack_api_url: 'https://hooks.slack.com/services/WEBHOOK/URL'
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
          {{ end }}
