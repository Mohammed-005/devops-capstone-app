name: Backend CI Pipeline

on:
    push:
        branches: [ main ]

jobs:
    build-and-scan:
        runs-on: ubuntu-latest
        permissions: 
            contents: write

        steps: 
        -   name: Checkout the Code
            uses: actions/checkout@v4

        -   name: Build the Image
            run: docker build -t devops-capstone-app:${{ github.sha }} .

        -   name: Run Trivy Vulnerability Scanner
            uses: aquasecurity/trivy-action@master
            with:
                image-ref: 'devops-capstone-app:${{ github.sha }}'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
        
        -   name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v4
            with: 
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}
        
        -   name: Login to Amazon ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2

        -   name: Tag and Push Image to ECR
            env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                ECR_REPOSITORY: devops-capstone-app
                IMAGE_TAG: ${{ github.sha }}
            run: |
                docker tag devops-capstone-app:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG 

        -   name: Update Image Tag in Helm values.yaml
            run: |
                sed -i "5s/tag: .*/tag: \"${{ github.sha }}\"/" helm/capstone-chart/values.yaml
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add helm/capstone-chart/values.yaml
                git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
                git push origin main
