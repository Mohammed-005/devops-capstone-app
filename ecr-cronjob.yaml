apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  name: ecr-secret-manager
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete", "patch", "update"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: 
  name: ecr-token-refresher-binding
  namespace: default
subjects: 
- kind: ServiceAccount
  name: ecr-token-refresher
  namespace: default
roleRef:
  kind: Role
  name: ecr-secret-manager
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: batch/v1
kind: CronJob
metadata: 
  name: ecr-token-refresher
  namespace: default
spec: 
  schedule: "0 */8 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresher
          containers: 
          - name: refresher
            image: alpine/k8s:1.32.13
            env:
            - name: AWS_ACCESS_KEY_ID
              value: 
            - name: AWS_SECRET_ACCESS_KEY
              value:
            - name: AWS_REGION
              value: "ap-southeast-2"
            command:
            - /bin/sh
            - "-c"
            - | 
              echo "Fetching new ECR Token"
              TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
              kubectl create secret docker-registry aws-ecr-secret \
              --docker-server=337405469571.dkr.ecr.ap-southeast-2.amazonaws.com --docker-username=AWS \
              --docker-password=$TOKEN \
              --dry-run=client -o yaml | kubectl apply -f -
          restartPolicy: OnFailure
